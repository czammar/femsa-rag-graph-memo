[project]
name = "femsa-rag-graph-memo"
version = "0.1.0"
description = "RAG clásico vs RAG agentic vs MEMO sobre el Informe Anual FEMSA 2024"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=7.1.1",
    "neo4j>=6.4.1",
    "torch>=2.15.0",
    "transformers>=5.24.1",
    "peft>=0.22.0",
    "accelerate>=1.16.0",
    "numpy>=2.5.5",
    "huggingface-hub>=0.30.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
